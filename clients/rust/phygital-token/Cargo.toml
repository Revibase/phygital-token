[package]
name = "phygital-token-client"
version = "0.4.0"
edition = "2021"
description = "Codama-generated Rust client for the phygital-token program"
license = "ISC"
repository = "https://github.com/jychab/phygital-nfts"
documentation = "https://github.com/jychab/phygital-nfts/tree/master/clients/rust/phygital-token"
readme = "README.md"
keywords = ["solana", "anchor", "phygital", "nft", "webauthn"]
categories = ["cryptography::cryptocurrencies"]

[lib]
name = "phygital_token_client"

[features]
default = []
anchor = ["dep:anchor-lang"]
anchor-idl-build = ["anchor", "anchor-lang/idl-build"]
# Off-chain account fetching helpers; not used on-chain.
fetch = ["dep:solana-account", "dep:solana-rpc-client"]

[dependencies]
anchor-lang = { version = "1.0.2", optional = true }
borsh = { version = "1", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "1"
solana-address = { version = "2.2.0", features = ["borsh"] }
solana-instruction = "3.2.0"
solana-account-info = "3.1.0"
solana-program-error = "3"
solana-cpi = "3.1.0"
solana-account = { version = "3", optional = true }
solana-rpc-client = { version = "3", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
