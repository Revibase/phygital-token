[package]
name = "phygital-token-client"
version = "0.1.0"
edition = "2021"
description = "Codama-generated Rust client for the phygital-token program"

[lib]
name = "phygital_token_client"

[features]
default = []
# Off-chain account fetching helpers; not used on-chain.
fetch = ["dep:solana-account", "dep:solana-rpc-client"]

# NOTE: dependencies are hand-maintained (codama's `syncCargoToml` is off in codama.json).
# codama's default `~` version pins fight the workspace's solana crates (e.g. litesvm needs
# solana-account ^3.2); these loose major ranges unify with the rest of the workspace.
[dependencies]
borsh = { version = "1", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "1"
solana-address = { version = "2", features = ["borsh"] }
solana-instruction = "3"
solana-account-info = "3"
solana-program-error = "3"
solana-cpi = "3"
solana-account = { version = "3", optional = true }
solana-rpc-client = { version = "3", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
