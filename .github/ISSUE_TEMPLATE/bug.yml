name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        [On-chain program, TypeScript SDK, Rust client, MCP server, Web app, Secure signer, Docs]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Transaction signatures, code snippets or a minimal test help most.
