name: TypeScript

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Other packages typecheck and test against the SDK's built output.
      - run: pnpm --filter phygital-token-sdk build
      # `wrangler types` reads binding names (never values) from .dev.vars.
      - run: cp app/.dev.vars.example app/.dev.vars
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter revibase exec wrangler types --check
      - run: pnpm test
      - name: Build packages
        run: |
          pnpm --filter phygital-token-mcp build
          pnpm --filter revibase build
      - name: SDK public API report is up to date
        run: pnpm --filter phygital-token-sdk exec api-extractor run
