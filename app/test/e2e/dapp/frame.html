<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Foreign site framing the signer</title>
	</head>
	<body>
		<!-- A site other than the app embeds the signer and tries to drive it. -->
		<iframe id="signer" src="https://localhost:5174/" allow="publickey-credentials-get *" title="signer"></iframe>
		<script>
			window.heard = [];
			addEventListener('message', (e) => window.heard.push({ origin: e.origin, data: e.data }));
		</script>
	</body>
</html>
