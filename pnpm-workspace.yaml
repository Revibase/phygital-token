packages:
  - "packages/js/*"
  - "app"

# Build-script approval (pnpm asks for an explicit decision per dependency).
# esbuild ships a required platform binary via its install script.
# bufferutil / utf-8-validate are optional native perf addons for `ws`
# (transitive via @solana rpc-subscriptions); `ws` falls back to pure JS,
# so we skip building them to avoid requiring a C toolchain everywhere.
allowBuilds:
  esbuild: true
  bufferutil: false
  utf-8-validate: false
  bigint-buffer: true
  workerd: true
  "@reown/appkit": false
  keccak: false

minimumReleaseAgeExclude:
  - "@noble/hashes@2.4.0"

# One version of each shared tool across the workspace. TypeScript stays on 6.x:
# 7.x ships no JavaScript compiler API, which typescript-eslint and api-extractor need.
catalog:
  typescript: 6.0.3
  vitest: ^5.0.5
  vite: ^8.3.4
  wrangler: ^4.152.0
  "@noble/curves": ^2.4.0
  "@noble/hashes": ^2.4.0
  "@types/node": ^26.6.5
