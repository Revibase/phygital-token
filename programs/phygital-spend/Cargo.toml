[package]
name = "phygital-spend"
version = "0.1.0"
description = "Passkey-gated SPL spending, composed with phygital-token verify_asset"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "phygital_spend"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "phygital-token-client/anchor-idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = { version = "1.0.2", features = ["token_2022_extensions"] }
phygital-token-client = { path = "../../clients/rust/phygital-token", features = ["anchor"] }
borsh = "1"
solana-instructions-sysvar = "3.0"
solana-sdk-ids = "3"

[dev-dependencies]
phygital-token = { path = "../phygital-token" }
phygital-token-hook = { path = "../phygital-token-hook" }
anchor-spl = { version = "1.0.2", features = ["token_2022_extensions"] }
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-slot-hashes = "3.0"
spl-token-group-interface = "0.7"
spl-token-2022-interface = "2.1"
spl-token-metadata-interface = "0.8"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8"
sha2 = "0.11.0"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
