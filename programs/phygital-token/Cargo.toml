[package]
name = "phygital-token"
version = "0.8.0"
description = "Solana program for phygital tokens with WebAuthn passkey verification"
license = "MIT"
authors = ["Revibase"]
repository = "https://github.com/Revibase/phygital-token"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "phygital_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4", "init-if-needed"] }
solana-sdk-ids = "3.1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
solana-security-txt = "1.1.3"

[dev-dependencies]
litesvm = { version = "0.18.0", features = ["precompiles"] }
solana-message = "4.2"
solana-transaction = "4.2"
solana-signer = "3.0"
solana-keypair = "3.1"
solana-signature = "3.5"
sha2 = "0.11.0"
base64 = "0.23.1"
solana-slot-hashes = "3.2"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8"
proptest = "1"


[lints]
workspace = true
