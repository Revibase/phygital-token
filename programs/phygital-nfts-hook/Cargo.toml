[package]
name = "phygital-nfts-hook"
version = "0.1.0"
description = "Transfer hook for phygital-nfts (separate program id to avoid CPI reentrancy)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "phygital_nfts_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
spl-discriminator = "0.4"
spl-transfer-hook-interface = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
