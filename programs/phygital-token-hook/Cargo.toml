[package]
name = "phygital-token-hook"
version = "0.1.0"
description = "Transfer hook for phygital-token (separate program id to avoid CPI reentrancy)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "phygital_token_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "phygital-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
spl-discriminator = "0.4"
spl-transfer-hook-interface = "0.9"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
phygital-token = { path = "../phygital-token" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
